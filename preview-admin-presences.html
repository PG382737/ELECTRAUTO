<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin · Présences (prototype)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<!--
    PROTOTYPE LOCAL — section « Présences » de l'admin, avec des données fictives.
    Lit et écrit les mêmes données que le terminal (preview-terminal.html) dans le navigateur :
    un punch fait au terminal apparaît ici tout de suite. Rien n'est envoyé en ligne.
-->
<style>
:root {
    --glass: rgba(255,255,255,.025);
    /* Couleurs du graphique, validées sur le fond des cartes (#18181b) avec le script du guide dataviz */
    --c-jobs: #c8842a;
    --c-idle: #71717a;
    --ink-2: #c3c2b7;
}

/* ----- Coquille de l'admin (éléments non inclus dans le prototype) ----- */
.dash { display: flex; }
.sidebar__link[disabled], .control-subtab[disabled] { opacity: .38; cursor: not-allowed; }
.sidebar__link[disabled]:hover { background: none; color: var(--text-muted); }
.pr-new { margin-left: 6px; padding: 2px 6px; border-radius: 4px; font-size: .6rem; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: #141414; background: var(--accent); }
.pr-alert-count[hidden] { display: none; }
.pr-alert-count { margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; font-size: .68rem; font-weight: 800; color: #fff; background: var(--danger); }
.pr-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; padding: 10px 16px; border-radius: var(--radius); border: 1px dashed rgba(207,138,46,.45); background: var(--accent-glow); color: var(--accent); font-size: .82rem; font-weight: 600; }
.pr-header-right { display: flex; align-items: center; gap: 14px; }
.pr-live { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--text-muted); }

/* ----- Vues et filtres ----- */
.pr-views { display: flex; gap: 6px; margin-bottom: 24px; }
.pr-view { display: none; }
.pr-view.is-active { display: block; }
.pr-filters { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.pr-seg { display: inline-flex; gap: 6px; }
.pr-seg .period-btn, .pr-views .period-btn { margin: 0; }
.pr-nav { display: inline-flex; align-items: center; gap: 8px; }
.pr-nav__label { min-width: 280px; text-align: center; font-weight: 700; font-size: .92rem; }
.pr-actions { margin-left: auto; display: flex; gap: 8px; }
.pr-select { padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-family: var(--font); font-size: .82rem; }
.pr-count { font-size: .8rem; color: var(--text-muted); }

/* ----- Cartes, KPI ----- */
.pr-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
.pr-kpis .monitoring-card__value { font-size: 1.6rem; }
.pr-ic { width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.pr-ic svg { width: 24px; height: 24px; }
.pr-ic--green  { background: rgba(34,197,94,.15);  color: #22c55e; }
.pr-ic--blue   { background: rgba(59,130,246,.15); color: #3b82f6; }
.pr-ic--orange { background: rgba(207,138,46,.15); color: #e09a3e; }
.pr-ic--red    { background: rgba(239,68,68,.15);  color: #ef4444; }
.pr-ic--amber  { background: rgba(245,158,11,.15); color: #f59e0b; }
.pr-ic--violet { background: rgba(168,85,247,.15); color: #a855f7; }
.pr-ic--grey   { background: rgba(138,138,150,.12); color: var(--text-muted); }
.pr-card { margin-bottom: 24px; padding: 20px 22px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-card); }
.pr-card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.pr-card__head h2 { font-size: 1rem; font-weight: 700; }
.pr-muted { font-size: .82rem; color: var(--text-muted); }
.pr-empty { padding: 18px 4px; font-size: .88rem; font-style: italic; color: var(--text-muted); }

/* ----- Éléments de tableau ----- */
.num { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pr-strong { font-weight: 700; }
.pr-emp { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.pr-av { width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; display: inline-grid; place-items: center; font-size: .72rem; font-weight: 800; color: #141414; background: linear-gradient(135deg, var(--c1), var(--c2)); }
.pr-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: .75rem; font-weight: 700; letter-spacing: .3px; white-space: nowrap; color: var(--text-muted); background: rgba(138,138,150,.12); }
.pr-pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pr-pill--in { color: var(--success); background: rgba(34,197,94,.12); }
.pr-pill--bad { color: #f87171; background: rgba(239,68,68,.12); }
.pr-tag { display: inline-block; margin: 1px 4px 1px 0; padding: 2px 8px; border-radius: 6px; font-size: .7rem; font-weight: 700; white-space: nowrap; color: var(--text-muted); background: rgba(138,138,150,.12); }
.pr-tag--warn { color: #fbbf24; background: rgba(245,158,11,.14); }
.pr-tag--bad { color: #f87171; background: rgba(239,68,68,.14); }
.pr-tag--admin { color: #c084fc; background: rgba(168,85,247,.14); }
.pr-chip { display: inline-flex; align-items: center; gap: 8px; margin: 2px 4px 2px 0; padding: 4px 10px; border-radius: 20px; font-size: .78rem; white-space: nowrap; color: var(--text); background: rgba(207,138,46,.1); border: 1px solid rgba(207,138,46,.22); }
.pr-chip b { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent-hover); }
.pr-good { font-weight: 700; color: var(--success); }
.pr-mid  { font-weight: 700; color: var(--accent); }
.pr-low  { font-weight: 700; color: var(--danger); }
.pr-mark { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; vertical-align: middle; }
.pr-mark--late { background: #f59e0b; }
.pr-mark--edit { background: #a855f7; }
.pr-mark--bad  { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.25); }
.pr-marks-legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: .75rem; color: var(--text-muted); }
.pr-marks-legend .pr-mark { margin: 0 6px 0 0; }
.pr-table-wrap { overflow-x: auto; }
.pr-note { margin-top: 14px; font-size: .78rem; line-height: 1.6; color: var(--text-muted); }
.pr-link { padding: 0; border: none; background: none; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }

/* ----- Alertes et fil d'activité ----- */
.pr-alert { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; padding: 12px 14px; border-radius: 8px; border-left: 3px solid; background: var(--bg-input); }
.pr-alert--critical { border-color: #ef4444; }
.pr-alert--warning { border-color: #f59e0b; }
.pr-alert svg { width: 20px; height: 20px; flex-shrink: 0; }
.pr-alert--critical svg { color: #ef4444; }
.pr-alert--warning svg { color: #f59e0b; }
.pr-alert__text { flex: 1; font-size: .88rem; line-height: 1.45; }
.pr-feed__row { display: grid; grid-template-columns: 70px 170px 190px 1fr; gap: 12px; align-items: center; padding: 9px 4px; font-size: .86rem; border-bottom: 1px solid var(--border); }
.pr-feed__row:last-child { border-bottom: none; }
.pr-time { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.pr-ev { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.pr-ev::before { content: ''; width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: var(--ev); }
.pr-ev--in { --ev: #22c55e; }
.pr-ev--out { --ev: #3b82f6; }
.pr-ev--job { --ev: #cf8a2e; }
.pr-ev--done { --ev: #14b8a6; }
.pr-ev--bad { --ev: #ef4444; }
.pr-ev--admin { --ev: #a855f7; }
.pr-src { font-size: .72rem; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; color: var(--text-muted); }
.pr-src--admin { color: #c084fc; }

/* ----- Fenêtres ----- */
.pr-modal-xl { max-width: 1120px; }
.pr-modal-xl .stats-grid { grid-template-columns: repeat(6, 1fr); margin-bottom: 20px; }
.pr-modal-xl .stat-card { padding: 16px 12px; }
.pr-modal-xl .stat-card__value { font-size: 1.4rem; }
.pr-sub td { padding: 10px 16px 14px 56px !important; background: rgba(255,255,255,.02); }
.pr-sub-toggle { cursor: pointer; }
.pr-erow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; margin-bottom: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); }
.pr-erow label { display: flex; flex-direction: column; gap: 4px; font-size: .72rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
.pr-erow input { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-family: var(--font); font-size: .9rem; color-scheme: dark; }
.pr-erow.is-deleted { opacity: .45; }
.pr-erow.is-deleted input { text-decoration: line-through; }
.pr-erow__hint { grid-column: 1 / -1; font-size: .75rem; color: var(--text-muted); }
.pr-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.pr-reason { padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: var(--font); font-size: .75rem; cursor: pointer; }
.pr-reason:hover { color: var(--text); border-color: var(--text-muted); }
.pr-error { min-height: 1.2em; margin-top: 6px; font-size: .82rem; color: #f87171; }
.pr-warn-note { margin: 4px 0 12px; font-size: .8rem; color: #fbbf24; }
.pr-check { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.pr-check input { width: 18px; height: 18px; accent-color: var(--accent); }
.pr-form-row { display: flex; gap: 16px; }
.pr-form-row .form-group { flex: 1; }

/* ----- Mobile : cartes au lieu des tableaux (le même contenu, deux présentations) ----- */
.pr-mhead, .pr-tabbar, .pr-mobile { display: none; }
.pr-mlist { flex-direction: column; gap: 10px; }
.pr-mcard { width: 100%; display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font: inherit; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .1s, background .15s; }
.pr-mcard:active { transform: scale(.985); background: var(--bg-hover); }
.pr-mcard--bad { border-color: rgba(239,68,68,.45); }
.pr-mcard--team { background: rgba(255,255,255,.02); cursor: default; }
.pr-mcard__top { display: flex; align-items: center; gap: 12px; }
.pr-mcard__top .pr-av { width: 40px; height: 40px; font-size: .85rem; }
.pr-mcard__who { flex: 1; min-width: 0; }
.pr-mcard__who b { display: block; font-size: .98rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-mcard__who span { display: block; margin-top: 2px; font-size: .78rem; color: var(--text-muted); }
.pr-mcard__total { font-size: 1.25rem; font-weight: 800; white-space: nowrap; }
.pr-mcard__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pr-mcard__stats div { padding: 8px 10px; border-radius: 10px; background: var(--bg-input); }
.pr-mcard__stats small { display: block; font-size: .64rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted); }
.pr-mcard__stats b { display: block; margin-top: 2px; font-size: .92rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pr-mcard__chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pr-mcard__chips .pr-chip, .pr-mcard__chips .pr-tag { margin: 0; }
.pr-mweek { display: grid; gap: 4px; }
.pr-mday { position: relative; padding: 7px 2px 6px; border-radius: 8px; text-align: center; background: var(--bg-input); }
.pr-mday small { display: block; font-size: .62rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.pr-mday b { display: block; margin-top: 2px; font-size: .74rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pr-mday.is-off b { color: #52525b; font-weight: 500; }
.pr-mday .pr-mark { position: absolute; top: 5px; right: 5px; margin: 0; width: 6px; height: 6px; }
.pr-mfeed__row, .pr-mhist__row { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--border); }
.pr-mfeed__row:last-child, .pr-mhist__row:last-child { border-bottom: none; }
.pr-mhist__when b { display: block; font-size: .86rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pr-mhist__when small { display: block; margin-top: 1px; font-size: .68rem; color: var(--text-muted); }
.pr-mhist__what { min-width: 0; }
.pr-mhist__who { margin-top: 3px; font-size: .88rem; font-weight: 600; }
.pr-mhist__what small { display: block; margin-top: 2px; font-size: .76rem; line-height: 1.4; color: var(--text-muted); }
.pr-mdayc { margin-bottom: 8px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-input); cursor: pointer; }
.pr-mdayc__top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pr-mdayc__top b { font-size: .92rem; }
.pr-mdayc__paid { font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.pr-mdayc__segs { margin-top: 4px; font-size: .84rem; line-height: 1.5; color: var(--text); }
.pr-mdayc__foot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: .78rem; color: var(--text-muted); }
.pr-mdayc__foot .icon-btn { margin-left: auto; width: 36px; height: 36px; }
.pr-mdayc__jobs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pr-mdayc__jobs[hidden] { display: none; }
.pr-mdayc__jobs .pr-chip { margin: 0; white-space: normal; }
.pr-mtitle { font-size: 1.45rem; font-weight: 800; letter-spacing: -.3px; }
.pr-msub { margin: 2px 0 16px; font-size: .82rem; color: var(--text-muted); }

@media (max-width: 820px) {
    html, body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    .dash { display: block; }
    .sidebar, .control-topbar, .pr-views, .main__header, .pr-desktop { display: none !important; }
    .pr-mobile { display: block; }
    .pr-mlist { display: flex; }
    .main { margin-left: 0; padding: calc(72px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }

    /* En-tête et onglets */
    .pr-mhead { display: flex; position: fixed; top: 0; left: 0; right: 0; z-index: 60; height: calc(58px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0 16px; align-items: center; justify-content: space-between; background: rgba(24,24,27,.9); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .pr-mhead__brand { display: flex; align-items: baseline; gap: 8px; }
    .pr-mhead__right { display: flex; align-items: center; gap: 12px; }
    .pr-mhead__right .pr-live { font-size: .72rem; }
    .pr-mhead__btn { width: 40px; height: 40px; }
    .pr-mhead__btn svg { width: 18px; height: 18px; }
    .pr-tabbar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(24,24,27,.94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--border); }
    .pr-tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 7px; border: none; border-radius: 12px; background: none; color: var(--text-muted); font-family: var(--font); font-size: .7rem; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .pr-tabbar button svg { width: 22px; height: 22px; }
    .pr-tabbar button.active { color: var(--accent); background: var(--accent-glow); }
    .pr-tabbar__badge { position: absolute; top: 3px; left: 50%; margin-left: 7px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: .62rem; font-style: normal; font-weight: 800; color: #fff; background: var(--danger); }
    .pr-tabbar__badge[hidden] { display: none; }

    .pr-banner { margin-bottom: 14px; padding: 8px 12px; flex-wrap: wrap; gap: 6px; font-size: .7rem; line-height: 1.4; }
    .pr-banner .btn { padding: 5px 10px; font-size: .7rem; }

    /* Cartes et chiffres */
    .pr-kpis, .pr-kpis--report { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .pr-kpis .monitoring-card { gap: 12px; padding: 14px 12px; border-radius: 14px; }
    .pr-ic { width: 38px; height: 38px; border-radius: 10px; }
    .pr-ic svg { width: 20px; height: 20px; }
    .pr-kpis .monitoring-card__value { font-size: 1.2rem; white-space: nowrap; }
    .pr-kpis .monitoring-card__label { font-size: .7rem; line-height: 1.3; }
    .pr-card { margin-bottom: 16px; padding: 16px 14px; border-radius: 14px; }
    .pr-card__head { flex-wrap: wrap; margin-bottom: 10px; }
    .pr-alert { flex-wrap: wrap; gap: 10px; }
    .pr-alert .btn { width: 100%; justify-content: center; padding: 11px; font-size: .88rem; }
    .pr-report-top { grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }

    /* Filtres : pleine largeur, gros boutons */
    .pr-filters { gap: 10px; margin-bottom: 16px; }
    .pr-seg { width: 100%; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
    .pr-seg--scroll { display: flex; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; width: calc(100% + 32px); }
    .pr-seg--scroll::-webkit-scrollbar { display: none; }
    .pr-seg--scroll .period-btn { flex-shrink: 0; }
    .period-btn { padding: 10px 14px; font-size: .84rem; }
    .pr-nav { width: 100%; justify-content: space-between; }
    .pr-nav .icon-btn { width: 42px; height: 42px; }
    .pr-nav__label { flex: 1; min-width: 0; font-size: .86rem; }
    .pr-actions { width: 100%; margin-left: 0; }
    .pr-actions .btn { flex: 1; justify-content: center; padding: 10px; }
    #btn-print { display: none; }
    .pr-select { flex: 1 1 45%; min-width: 0; padding: 11px 12px; font-size: 16px; }
    .pr-count { width: 100%; }
    .pr-marks-legend { gap: 12px; }
    .control-pagination { gap: 10px; }
    .control-pagination .btn { flex: 1; justify-content: center; padding: 10px; }

    /* Fenêtres : plein écran, seul le contenu défile */
    .modal-overlay { padding: 0; align-items: stretch; overflow: hidden; }
    .modal-overlay .modal, .modal-overlay .pr-modal-xl { width: 100%; max-width: 100%; height: 100vh; height: 100dvh; margin: 0; border: none; border-radius: 0; display: flex; flex-direction: column; animation: none; }
    .modal__header { padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
    .modal__header h2 { font-size: 1.02rem; }
    .modal__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .modal__footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); gap: 8px; }
    .modal__footer .btn { flex: 1; justify-content: center; padding: 12px; margin: 0 !important; }
    .pr-modal-xl .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .pr-modal-xl .stat-card { padding: 12px 6px; }
    .pr-modal-xl .stat-card__value { font-size: 1.02rem; }
    .pr-modal-xl .stat-card__label { font-size: .6rem; }
    .pr-erow { gap: 8px; padding: 10px; }
    .pr-erow input, .form-group input, .form-group textarea { font-size: 16px; }
    .pr-form-row { flex-direction: column; gap: 0; }
    .pr-chips .pr-reason { padding: 7px 12px; font-size: .8rem; }
}

</style>
</head>
<body>
<div class="dash">
    <!-- Mobile : en-tête fixe (comme le mode mobile de l'admin) -->
    <header class="pr-mhead">
        <div class="pr-mhead__brand"><span class="mobile-header__logo">ELECTR<span>'</span>AUTO</span><small class="mobile-header__tag">Présences</small></div>
        <div class="pr-mhead__right">
            <span class="pr-live"><span class="monitoring-live-dot"></span>En direct</span>
        </div>
    </header>
    <aside class="sidebar">
        <div class="sidebar__brand">
            <span class="sidebar__logo">ELECTR<span>'</span>AUTO</span>
            <small>Admin</small>
        </div>
        <nav class="sidebar__nav">
            <button class="sidebar__link active"><svg data-icon="gear"></svg>Gestion</button>
            <button class="sidebar__link" disabled title="Pas inclus dans le prototype"><svg data-icon="clock"></svg>Délais</button>

<script src="preview-punch-data.js"></script>
<script>
(() => {
    'use strict';

    const P = window.PunchProto;
    const E = P.EMPLOYEES, V = P.VEHICLES;
    const HOUR = 3600000, NB = ' ';
    const PAGE_SIZE = 25;
    const TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    let db = P.load();
    let settings = P.loadSettings();
    const now = () => P.now(db);
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const EVENT_TYPES = {
        in:          { label: 'Punch IN',         tone: 'in' },
        out:         { label: 'Punch OUT',        tone: 'out' },
        job_start:   { label: 'Job commencée',    tone: 'job' },
        job_end:     { label: 'Job terminée',     tone: 'done' },
        refus_out:   { label: 'Punch OUT refusé', tone: 'bad' },
        refus_job:   { label: 'Job refusée',      tone: 'bad' },
        inconnu:     { label: 'Badge inconnu',    tone: 'bad' },
        correction:  { label: 'Correction',       tone: 'admin' },
        ajout:       { label: 'Punch ajouté',     tone: 'admin' },
        suppression: { label: 'Punch supprimé',   tone: 'admin' },
    };
    const TYPE_GROUPS = { punch: ['in', 'out'], job: ['job_start', 'job_end'], refus: ['refus_out', 'refus_job', 'inconnu'], admin: ['correction', 'ajout', 'suppression'] };

    const st = {
        view: 'today',
        hist: { range: '7', emp: '', type: '', page: 0 },
        detail: null,   // { emp, from, to, label }
        edit: null,     // { emp, day, rows: [...] }
    };

    /* ================= Icônes ================= */
    const ICONS = {
        gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
        clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
        note: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        check: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
        pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
        nfc: '<path d="M6 8.32a7.43 7.43 0 0 1 0 7.36"/><path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58"/><path d="M12.91 4.1a15.91 15.91 0 0 1 .01 15.8"/><path d="M16.37 2a20.16 20.16 0 0 1 0 20"/>',
        users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        car: '<circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 17H3v-6l2-5h9l4 5h1a2 2 0 0 1 2 2v4h-2m-4 0H9"/>',
        pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
        image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
        grid: '<rect x="2" y="2" width="20" height="20" rx="2"/><path d="M12 6v12M6 12h12"/>',
        wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
        alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
        gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        alarm: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/>',
        eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
        edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
        trash: '<path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
        undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
        left: '<path d="m15 18-6-6 6-6"/>',
        right: '<path d="m9 18 6-6-6-6"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
        printer: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
        chart: '<path d="M3 3v18h18"/><path d="M7 16v-5"/><path d="M12 16V8"/><path d="M17 16v-9"/>',
        list: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
        sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    };
    const svg = (name, style = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${style ? ` style="${style}"` : ''}>${ICONS[name]}</svg>`;

    /* ================= Formats ================= */
    const hm = P.fmtHM;
    const dur = ms => ms >= 30000 ? P.fmtDur(ms) : '—';
    const late = min => P.fmtDur(min * 60000);   // 23 min, ou 8 h 41 pour une arrivée très tardive
    const pct = x => x == null ? '—' : `${Math.round(x * 100)}${NB}%`;
    const utilClass = x => x == null ? '' : x >= .8 ? 'pr-good' : x >= .5 ? 'pr-mid' : 'pr-low';
    const utilTone = x => x == null ? 'grey' : x >= .8 ? 'green' : x >= .5 ? 'orange' : 'red';
    const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
    const dayNum = d => d.getDate() === 1 ? '1er' : String(d.getDate());
    const monthName = d => d.toLocaleDateString('fr-CA', { month: 'long' });
    const isWeekend = ms => [0, 6].includes(new Date(ms).getDay());
    const minToTime = m => { const r = Math.round(m); return `${String(Math.floor(r / 60)).padStart(2, '0')}:${String(r % 60).padStart(2, '0')}`; };
    const timeToMin = s => { const [h, m] = String(s).split(':').map(Number); return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null; };
    const plural = (n, w) => `${n}${NB}${w}${n > 1 ? 's' : ''}`;

    function relDay(ms) {
        const d = P.dayStart(ms), today = P.dayStart(now());
        if (d === today) return 'aujourd’hui';
        if (d === P.addDays(today, -1)) return 'hier';
        const x = new Date(ms);
        return `${x.toLocaleDateString('fr-CA', { weekday: 'long' })} ${dayNum(x)}`;
    }
    function weekLabel(from) {
        const a = new Date(from), b = new Date(P.addDays(from, 6));
        return a.getMonth() === b.getMonth()
            ? `Semaine du ${dayNum(a)} au ${dayNum(b)} ${monthName(b)} ${b.getFullYear()}`
            : `Semaine du ${dayNum(a)} ${monthName(a)} au ${dayNum(b)} ${monthName(b)} ${b.getFullYear()}`;
    }
    const monthLabel = from => cap1(new Date(from).toLocaleDateString('fr-CA', { month: 'long', year: 'numeric' }));
    const isoDate = ms => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

    const avatar = id => `<span class="pr-av" style="--c1:${E[id].c1};--c2:${E[id].c2}">${E[id].first[0]}${E[id].last[0]}</span>`;
    const empCell = id => `<span class="pr-emp">${avatar(id)}<span>${esc(P.fullName(id))}</span></span>`;
    const vehLabel = id => `${P.vehName(id)} (${V[id].plate})`;
    const kpi = (icon, tone, value, label) => `<div class="monitoring-card"><div class="pr-ic pr-ic--${tone}">${svg(icon)}</div><div><div class="monitoring-card__value">${value}</div><div class="monitoring-card__label">${label}</div></div></div>`;
    const evBadge = type => { const t = EVENT_TYPES[type] || { label: type, tone: 'admin' }; return `<span class="pr-ev pr-ev--${t.tone}">${t.label}</span>`; };

    /* ================= Aujourd'hui ================= */
    function teamPaidToday() {
        const t = now(), d0 = P.dayStart(t), d1 = P.addDays(d0, 1);
        return Object.keys(E).reduce((n, id) => n + P.paidMs(db, id, d0, d1, settings, t), 0);
    }

    function renderToday() {
        const t = now(), today = P.dayStart(t);
        const ids = Object.keys(E);
        const rows = ids.map(id => ({ id, info: P.dayInfo(db, id, today, settings, t), punch: P.openPunch(db, id), jobs: P.openJobsOf(db, id) }))
            .sort((a, b) => (!!b.punch - !!a.punch) || P.fullName(a.id).localeCompare(P.fullName(b.id), 'fr'));
        const al = P.alerts(db, settings, t);
        const openJobs = db.jobs.filter(j => !j.end).length;

        $('pv-today').innerHTML = `
            <div class="pr-mobile"><h1 class="pr-mtitle">Aujourd’hui</h1><p class="pr-msub">${cap1(P.fmtDateLong(t))}</p></div>
            <div class="pr-kpis">
                ${kpi('users', 'green', `${rows.filter(r => r.punch).length}${NB}/${NB}${ids.length}`, 'Au travail maintenant')}
                ${kpi('clock', 'blue', `<span data-team-paid>${dur(teamPaidToday())}</span>`, 'Heures payées aujourd’hui')}
                ${kpi('wrench', 'orange', openJobs, 'Jobs en cours')}
                ${kpi('alert', al.length ? 'red' : 'grey', al.length, al.length > 1 ? 'Punchs à corriger' : 'Punch à corriger')}
            </div>
            ${al.length ? `<div class="pr-card"><div class="pr-card__head"><h2>À corriger</h2></div>${al.map(alertRow).join('')}</div>` : ''}
            <div class="pr-mobile pr-mlist" style="margin-bottom:16px">${rows.map(todayCard).join('')}</div>
            <div class="pr-card pr-desktop">
                <div class="pr-card__head"><h2>Statut des employés</h2><span class="pr-muted">${cap1(P.fmtDateLong(t))}</span></div>
                <div class="pr-table-wrap"><table class="control-table">
                    <thead><tr><th>Employé</th><th>Statut</th><th>Arrivée</th><th>Départ</th><th class="num">Payées aujourd’hui</th><th>Jobs en cours</th><th></th></tr></thead>
                    <tbody>${rows.map(todayRow).join('')}</tbody>
                </table></div>
            </div>
            <div class="pr-card">
                <div class="pr-card__head"><h2>Activité du jour</h2><button class="btn btn--ghost btn--sm" data-goto="history">Tout l’historique</button></div>
                ${feed(today, t)}
            </div>`;
    }

    function alertRow(a) {
        const hours = Math.floor((now() - a.punch.in) / HOUR);
        return `<div class="pr-alert pr-alert--critical">${svg('alert')}<div class="pr-alert__text"><b>${esc(P.fullName(a.emp))}</b> est encore IN depuis ${relDay(a.punch.in)} à ${hm(a.punch.in)} (${hours}${NB}h). Probablement un oubli de punch OUT.</div>
            <button class="btn btn--primary btn--sm" data-edit="${a.emp}" data-day="${a.day}">Corriger</button></div>`;
    }

    function todayRow(r) {
        const t = now(), today = P.dayStart(t);
        const forgot = r.punch && t - r.punch.in > settings.forgotHours * HOUR;
        const status = r.punch
            ? forgot
                ? `<span class="pr-pill pr-pill--bad"><i></i>IN depuis ${relDay(r.punch.in)} ${hm(r.punch.in)}</span>`
                : `<span class="pr-pill pr-pill--in"><i></i>IN</span> <span class="pr-muted">depuis ${hm(r.punch.in)}</span>`
            : '<span class="pr-pill">OUT</span>';
        const arrival = r.info.firstIn ? `${hm(r.info.firstIn)}${r.info.lateMin ? ` <span class="pr-tag pr-tag--warn">+${late(r.info.lateMin)}</span>` : ''}` : '<span class="pr-muted">—</span>';
        const departure = r.info.lastOut ? hm(r.info.lastOut) : r.punch ? '<span class="pr-muted">en cours</span>' : '<span class="pr-muted">—</span>';
        const shown = r.jobs.slice(0, 2);
        const jobs = r.jobs.length
            ? shown.map(j => `<span class="pr-chip">${esc(P.vehName(j.veh))}<b data-since="${j.start}">${P.fmtDur(t - j.start)}</b></span>`).join('') + (r.jobs.length > 2 ? `<span class="pr-tag">+${r.jobs.length - 2}</span>` : '')
            : '<span class="pr-muted">—</span>';
        return `<tr>
            <td>${empCell(r.id)}</td>
            <td>${status}</td>
            <td>${arrival}</td>
            <td>${departure}</td>
            <td class="num pr-strong"><span data-paid-today="${r.id}">${dur(r.info.paid)}</span></td>
            <td>${jobs}</td>
            <td><div class="col-actions col-actions--icons">
                <button class="icon-btn" data-detail="${r.id}" title="Détail de la semaine">${svg('eye')}</button>
            </div></td>
        </tr>`;
    }

    // Mobile : une carte par employé (toucher = détail de la semaine)
    function todayCard(r) {
        const t = now();
        const forgot = r.punch && t - r.punch.in > settings.forgotHours * HOUR;
        const pill = r.punch ? (forgot ? '<span class="pr-pill pr-pill--bad"><i></i>IN</span>' : '<span class="pr-pill pr-pill--in"><i></i>IN</span>') : '<span class="pr-pill">OUT</span>';
        const sub = r.punch ? (forgot ? `IN depuis ${relDay(r.punch.in)} ${hm(r.punch.in)}` : `depuis ${hm(r.punch.in)}`) : (r.info.lastOut ? `sorti à ${hm(r.info.lastOut)}` : 'pas de punch aujourd’hui');
        const jobs = r.jobs.slice(0, 2).map(j => `<span class="pr-chip">${esc(P.vehName(j.veh))}<b data-since="${j.start}">${P.fmtDur(t - j.start)}</b></span>`).join('') + (r.jobs.length > 2 ? `<span class="pr-tag">+${r.jobs.length - 2}</span>` : '');
        return `<button class="pr-mcard ${forgot ? 'pr-mcard--bad' : ''}" data-detail="${r.id}">
            <div class="pr-mcard__top">${avatar(r.id)}<div class="pr-mcard__who"><b>${esc(P.fullName(r.id))}</b><span>${sub}</span></div>${pill}</div>
            <div class="pr-mcard__stats">
                <div><small>Arrivée</small><b>${r.info.firstIn ? hm(r.info.firstIn) : '—'}${r.info.lateMin ? ' <i class="pr-mark pr-mark--late"></i>' : ''}</b></div>
                <div><small>Départ</small><b>${r.info.lastOut ? hm(r.info.lastOut) : r.punch ? 'en cours' : '—'}</b></div>
                <div><small>Payées</small><b data-paid-today="${r.id}">${dur(r.info.paid)}</b></div>
            </div>
            ${jobs ? `<div class="pr-mcard__chips">${jobs}</div>` : ''}
        </button>`;
    }

    function feed(from, t) {
        const list = db.events.filter(e => e.t >= from && e.t <= t + 60000).sort((a, b) => b.t - a.t).slice(0, 8);
        if (!list.length) return '<div class="pr-empty">Aucune activité aujourd’hui pour l’instant.</div>';
        const detail = e => esc([e.veh ? vehLabel(e.veh) : '', e.detail].filter(Boolean).join(' · '));

    /* ================= Correction des punchs ================= */
    function openEditor(emp, day) {
        const end = P.addDays(day, 1);
        const rows = db.punches.filter(p => p.emp === emp && p.in >= day && p.in < end).sort((a, b) => a.in - b.in).map(p => ({
            id: p.id,
            inMin: P.minutesOfDay(p.in),
            outMin: p.out && p.out < end ? P.minutesOfDay(p.out) : null,
            origIn: p.in, origOut: p.out,
            deleted: false,
            hint: !p.out ? 'Toujours IN : entre l’heure de sortie si l’employé a oublié de puncher OUT.'
                : p.out >= end ? `Sortie enregistrée ${relDay(p.out)} à ${hm(p.out)}.` : '',
        }));
        if (!rows.length) rows.push({ id: null, inMin: null, outMin: null, deleted: false, hint: 'Aucun punch ce jour-là : ajoute l’entrée et la sortie.' });
        st.edit = { emp, day, rows };
        $('m-edit-sub').textContent = `${P.fullName(emp)} · ${cap1(P.fmtDateLong(day))}`;
        const open = P.openJobsOf(db, emp);
        $('m-edit-warn').innerHTML = open.length ? `<p class="pr-warn-note">Attention : ${esc(E[emp].first)} a encore ${plural(open.length, 'job')} ouverte${open.length > 1 ? 's' : ''} (${esc(open.map(j => P.vehName(j.veh)).join(', '))}). Corriger les punchs ne ferme pas les jobs.</p>` : '';
        $('m-edit-reason').value = '';
        $('m-edit-error').textContent = '';

        $('m-edit').classList.add('active');
    }

        $('m-edit-rows').innerHTML = st.edit.rows.map((r, i) => `<div class="pr-erow ${r.deleted ? 'is-deleted' : ''}" data-row="${i}">
            <label>Entrée<input type="time" data-f="in" value="${r.inMin != null ? minToTime(r.inMin) : ''}" ${r.deleted ? 'disabled' : ''}></label>
            <label>Sortie<input type="time" data-f="out" value="${r.outMin != null ? minToTime(r.outMin) : ''}" ${r.deleted ? 'disabled' : ''}></label>

    function saveEditor() {
        const ed = st.edit, t = now(), today = P.dayStart(t), end = P.addDays(ed.day, 1);
        const reason = $('m-edit-reason').value.trim();
        const err = msg => { $('m-edit-error').textContent = msg; };
        // Une ligne ajoutée puis laissée vide est simplement ignorée
        const rows = ed.rows.filter(r => !r.deleted && !(r.id == null && r.inMin == null && r.outMin == null));
        // Une sortie déjà enregistrée un autre jour, qu'on ne touche pas, compte comme une sortie en fin de journée
        const outOf = r => r.outMin != null ? r.outMin : (r.id != null && r.origOut && r.origOut >= end ? 24 * 60 : null);
        for (const r of rows) {
            if (r.inMin == null) return err('Chaque punch doit avoir une heure d’entrée.');
            if (outOf(r) != null && outOf(r) <= r.inMin) return err('L’heure de sortie doit être après l’heure d’entrée.');
        }
        const sorted = rows.slice().sort((a, b) => a.inMin - b.inMin);
        for (let i = 1; i < sorted.length; i++) {
            if (outOf(sorted[i - 1]) == null || sorted[i].inMin < outOf(sorted[i - 1])) return err('Deux punchs se chevauchent : vérifie les heures.');
        }
        const openRows = sorted.filter(r => outOf(r) == null);
        if (openRows.length && (ed.day !== today || openRows[0] !== sorted[sorted.length - 1])) return err('Indique l’heure de sortie : seul le dernier punch d’aujourd’hui peut rester ouvert.');
        if (ed.day === today && sorted.some(r => P.at(ed.day, r.inMin) > t || (r.outMin != null && P.at(ed.day, r.outMin) > t))) return err('Une heure est dans le futur.');
        if (openRows.length) {
            const other = db.punches.find(p => p.emp === ed.emp && !p.out && (p.in < ed.day || p.in >= end));
            if (other) return err(`${E[ed.emp].first} a déjà un punch ouvert (${relDay(other.in)} ${hm(other.in)}) : corrige-le d’abord.`);
        }

        const changes = [];
        ed.rows.forEach(r => {
            const newIn = r.inMin != null ? P.at(ed.day, r.inMin) : null;
            const newOut = r.outMin != null ? P.at(ed.day, r.outMin) : null;
            if (r.id == null) { if (!r.deleted && newIn != null) changes.push({ kind: 'ajout', r, newIn, newOut }); return; }
            if (r.deleted) { changes.push({ kind: 'suppression', r }); return; }
            // Une sortie enregistrée un autre jour qu'on ne touche pas reste telle quelle
            const keepOut = r.outMin == null && r.origOut && r.origOut >= end;
            const finalOut = keepOut ? r.origOut : newOut;
            if (Math.abs(newIn - r.origIn) >= 60000 || (finalOut || 0) !== (r.origOut || 0) && Math.abs((finalOut || 0) - (r.origOut || 0)) >= 60000) {
                changes.push({ kind: 'correction', r, newIn, newOut: finalOut });
            }
        });
        if (!changes.length) return err('Aucun changement à enregistrer.');
        if (!reason) return err('Indique la raison de la correction.');

        changes.forEach(c => {
            if (c.kind === 'ajout') {
                db.punches.push({ id: db.nextId++, emp: ed.emp, in: c.newIn, out: c.newOut, edited: { at: t, reason, before: null } });
                P.addEvent(db, t, 'ajout', ed.emp, null, `${hm(c.newIn)} → ${c.newOut ? hm(c.newOut) : 'en cours'} · ${reason}`, 'admin');
            } else if (c.kind === 'suppression') {
                db.punches = db.punches.filter(p => p.id !== c.r.id);
                P.addEvent(db, t, 'suppression', ed.emp, null, `${hm(c.r.origIn)} → ${c.r.origOut ? hm(c.r.origOut) : 'en cours'} · ${reason}`, 'admin');
            } else {
                const p = db.punches.find(x => x.id === c.r.id);
                const parts = [];
                if (Math.abs(c.newIn - p.in) >= 60000) parts.push(`Entrée ${hm(p.in)} → ${hm(c.newIn)}`);
                if (!p.out && c.newOut) parts.push(`Sortie ajoutée à ${hm(c.newOut)}`);
                else if (p.out && c.newOut && Math.abs(c.newOut - p.out) >= 60000) parts.push(`Sortie ${hm(p.out)} → ${hm(c.newOut)}`);
                else if (p.out && !c.newOut) parts.push('Sortie retirée');
                p.edited = { at: t, reason, before: { in: p.in, out: p.out } };
                p.in = c.newIn;
                p.out = c.newOut;
                P.addEvent(db, t, 'correction', ed.emp, null, `${parts.join(', ')} · ${reason}`, 'admin');
            }
        });
        db.punches.sort((a, b) => a.in - b.in);
        P.save(db);
        closeModal('m-edit');
        renderCurrent();
        if (st.detail) renderDetail();
    }

    /* ================= Exports CSV (séparateur « ; » et virgule décimale, comme Excel en français) ================= */
    function downloadCsv(filename, rows) {
        const cell = v => { const s = v == null ? '' : String(v).replace(/ /g, ' '); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
        const csv = '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = `${filename}.csv`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    }
    const hrs = ms => P.fmtHours(ms);
    const pctNum = x => x == null ? '' : Math.round(x * 100);

    function exportHistory() {
        const rows = [['Date', 'Heure', 'Employé', 'Événement', 'Véhicule', 'Plaque', 'Détail', 'Source']];
        historyList().forEach(e => rows.push([isoDate(e.t), hm(e.t), e.emp ? P.fullName(e.emp) : '', (EVENT_TYPES[e.type] || { label: e.type }).label, e.veh ? P.vehName(e.veh) : '', e.veh ? V[e.veh].plate : '', e.detail, e.src === 'admin' ? 'Admin' : 'Terminal']));
        downloadCsv(`historique-presences-${isoDate(now())}`, rows);
    }

    function exportDetail() {
        const d = st.detail, rep = P.periodReport(db, d.from, d.to, settings, now());
        const r = rep.rows.find(x => x.emp === d.emp);
        const rows = [[P.fullName(d.emp), d.label], [], ['Date', 'Arrivée', 'Départ', 'Heures payées', 'Heures jobs', 'Nb de jobs', 'Retard (min)', 'Notes']];
        r.days.filter(x => x.punches.length || x.jobs.length).forEach(x => rows.push([
            isoDate(x.day), x.firstIn ? hm(x.firstIn) : '', x.lastOut ? hm(x.lastOut) : (x.open ? 'en cours' : ''),
            hrs(x.paid), hrs(x.jobTime), x.jobs.length, x.lateMin || '',
            [x.corrected ? 'modifié par l’admin' : '', x.forgotten ? 'punch OUT manquant' : ''].filter(Boolean).join(', '),
        ]));
        rows.push(['Total', '', '', hrs(r.paid), hrs(r.jobTime), r.jobsCount, '', '']);
        downloadCsv(`presences-${E[d.emp].first.toLowerCase()}-${isoDate(d.from)}`, rows);
    }

    function closeModal(id) {
        $(id).classList.remove('active');
        if (id === 'm-detail') st.detail = null;
        if (id === 'm-edit') st.edit = null;
    }

    function init() {
        document.querySelectorAll('svg[data-icon]').forEach(el => { el.outerHTML = svg(el.dataset.icon, el.getAttribute('style') || ''); });

        document.addEventListener('click', ev => {
            const el = ev.target.closest('button, [data-detail], [data-toggle-sub], [data-toggle-msub], .modal-overlay');
            if (!el) return;
            const ds = el.dataset;
            if (el.classList.contains('modal-overlay')) { if (ev.target === el) closeModal(el.id); return; }
            if ('close' in ds) return closeModal(el.closest('.modal-overlay').id);
            if (ds.view) { st.view = ds.view; window.scrollTo(0, 0); return renderCurrent(); }
            if (ds.goto) { st.view = ds.goto; return renderCurrent(); }
            if (ds.hrange) { st.hist.range = ds.hrange; st.hist.page = 0; return renderHistory(); }
            if (ds.page != null) { st.hist.page = Number(ds.page); return renderHistory(); }
            if (ds.edit) { ev.stopPropagation(); return openEditor(ds.edit, Number(ds.day)); }
            if (ds.detail) return openDetail(ds.detail);
            if (ds.toggleMsub) { const sub = document.querySelector(`#m-detail [data-msub="${ds.toggleMsub}"]`); if (sub) sub.hidden = !sub.hidden; return; }
            if (ds.toggleSub) { const sub = document.querySelector(`#m-detail [data-sub="${ds.toggleSub}"]`); if (sub) sub.hidden = !sub.hidden; return; }
            if (ds.reason) { const ta = $('m-edit-reason'); ta.value = ta.value.trim() ? `${ta.value.trim()}, ${ds.reason.toLowerCase()}` : ds.reason; return; }
            if (ds.rowDel != null) { const r = st.edit.rows[Number(ds.rowDel)]; if (r.id == null) st.edit.rows.splice(Number(ds.rowDel), 1); else r.deleted = !r.deleted; return renderEditorRows(); }
            if (el.id === 'm-edit-add') { st.edit.rows.push({ id: null, inMin: null, outMin: null, deleted: false, hint: '' }); return renderEditorRows(); }
            if (el.id === 'm-edit-save') return saveEditor();
            if (el.id === 'btn-history-csv') return exportHistory();
            if (el.id === 'm-detail-csv') return exportDetail();
            if (el.id === 'btn-reset') {
                if (!confirm('Remettre les données de démo à zéro ? Les punchs faits au terminal seront effacés.')) return;
                db = P.seed();
                P.save(db);
                return renderCurrent();
            }
        });
        document.addEventListener('change', ev => {
            const t = ev.target;
            if (t.id === 'h-emp') { st.hist.emp = t.value; st.hist.page = 0; renderHistory(); }
            if (t.id === 'h-type') { st.hist.type = t.value; st.hist.page = 0; renderHistory(); }
            if (t.dataset.f && st.edit) {
                const r = st.edit.rows[Number(t.closest('[data-row]').dataset.row)];
                r[t.dataset.f === 'in' ? 'inMin' : 'outMin'] = t.value ? timeToMin(t.value) : null;
            }
        });
        document.addEventListener('keydown', ev => {
            if (ev.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => closeModal(m.id));
        });
        // Un punch au terminal (autre onglet) arrive ici tout de suite
        window.addEventListener('storage', ev => {
            if (ev.key === P.KEY) { db = P.load(); renderCurrent(); if (st.detail) renderDetail(); }
        });

        renderCurrent();
        setInterval(tick, 1000);
    }

    init();
})();
</script>
</body>
</html>
