<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperçu mobile · Présences (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<!--
    PROTOTYPE LOCAL — montre l'admin « Présences » tel qu'il s'affiche sur un cellulaire.
    Le cadre contient la vraie page (preview-admin-presences.html) : mêmes données locales que le terminal.
-->
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { display: flex; align-items: center; justify-content: center; gap: 56px; padding: 24px; font-family: 'Inter', system-ui, sans-serif; color: #f4f4f5; background: radial-gradient(ellipse at 50% 40%, #1a1a1f, #070708 70%); }
    .phone { position: relative; flex-shrink: 0; width: 414px; height: 868px; padding: 12px; border-radius: 60px; background: #0c0c0e; box-shadow: 0 0 0 2px #2a2a30, 0 0 0 7px #121215, 0 40px 120px rgba(0,0,0,.7); }
    .phone::before { content: ''; position: absolute; top: 24px; left: 50%; z-index: 2; width: 120px; height: 34px; border-radius: 20px; background: #000; transform: translateX(-50%); }
    .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 48px; background: #0e0e10; }
    .side { max-width: 340px; }
    .side small { display: inline-block; padding: 4px 9px; border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: #f3b75f; background: rgba(207,138,46,.1); border: 1px dashed rgba(207,138,46,.45); }
    .side h1 { margin: 14px 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
    .side p { font-size: 14px; line-height: 1.6; color: rgba(244,244,245,.6); }
    .side a { display: inline-flex; margin: 18px 12px 0 0; padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); font-size: 13px; font-weight: 600; text-decoration: none; color: #f4f4f5; background: rgba(255,255,255,.04); }
    .side a:hover { border-color: #cf8a2e; }
    @media (max-width: 860px) { .side { display: none; } }
</style>
</head>
<body>
    <div class="phone"><iframe src="preview-admin-presences.html" title="Admin Présences sur cellulaire"></iframe></div>
    <div class="side">
        <small>Prototype local · aperçu cellulaire</small>
        <h1>Présences, version mobile</h1>
        <p>La même page que sur l’ordinateur : elle passe toute seule en version mobile sur un écran de téléphone. Les punchs faits au terminal y apparaissent en direct.</p>
        <a href="preview-terminal.html" target="_blank" rel="noopener">Ouvrir le terminal</a>
        <a href="preview-admin-presences.html" target="_blank" rel="noopener">Version ordinateur</a>
    </div>
</body>
</html>
